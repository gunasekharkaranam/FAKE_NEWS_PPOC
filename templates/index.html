<!DOCTYPE html>
<html>
<head>
    <title>FAKE_NEWS_DETECTOR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>FAKE_NEWS_DETECTOR</h1>
        <form method="POST">
            <textarea name="text" placeholder="Enter news text here..." required>{{ original_text or '' }}</textarea>
            <button type="submit">Check</button>
        </form>

        {% if original_text %}
        <div class="user-input">
            <h3>Entered News:</h3>
            <p>{{ original_text }}</p>
        </div>
        {% endif %}

        {% if prediction %}
        <div class="result">
            <p><strong>Prediction:</strong> {{ prediction }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
